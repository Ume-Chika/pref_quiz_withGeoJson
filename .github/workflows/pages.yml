name: Check and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate static site
        run: node .github/validate.mjs
      - name: Test in Chrome
        run: node .github/chrome-smoke.mjs
      - name: Audit mobile performance
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Print Lighthouse score
        run: >-
          node -e "const fs=require('fs'),dir='.lighthouseci/reports';const report=fs.readdirSync(dir).filter(name=>name.endsWith('.json')).map(name=>JSON.parse(fs.readFileSync(dir+'/'+name))).find(item=>item.categories?.performance);console.log('Lighthouse mobile Performance: '+Math.round(report.categories.performance.score*100))"
      - name: Save Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ github.run_id }}
          path: .lighthouseci/reports
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
